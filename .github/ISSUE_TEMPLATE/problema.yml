name: Bug report
description: Something did not work in a game or in the installer
labels: [bug]
body:
  - type: input
    id: jogo
    attributes:
      label: Game (and version)
      placeholder: "e.g. Resident Evil Requiem (Steam)"
    validations:
      required: true
  - type: input
    id: placa
    attributes:
      label: GPU and driver
      placeholder: "e.g. RX 9070 XT, Adrenalin 26.x"
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Resolution and FSR mode
      placeholder: "e.g. 4K, FSR Ultra Performance, Frame Generation on"
  - type: input
    id: versao
    attributes:
      label: AMDLSS5 version
      placeholder: "e.g. 1.3.0"
    validations:
      required: true
  - type: textarea
    id: oque
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you saw
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Drop the dlssnr_on_amd.log and nr_*.log files from the game folder here (or a zip with them)
  - type: checkboxes
    id: overlay
    attributes:
      label: Checked
      options:
        - label: The AMD Adrenalin metrics/recording overlay was off
